<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>my-blog2</title>
  <meta name="description" content="마크다운으로 쓰는 정적 블로그">
  <!-- 깜빡임 방지: CSS보다 먼저 테마를 적용한다 -->
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__brand" href="#/">my-blog2</a>
      <nav class="site-header__nav" aria-label="주요 메뉴">
        <a class="site-header__link" href="#/">글 목록</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="다크모드 전환">
          <span aria-hidden="true" class="theme-toggle__icon"></span>
        </button>
      </nav>
    </div>
  </header>
  <main id="main" class="site-main" tabindex="-1"></main>
  <footer class="site-footer">
    <p>© 2026 my-blog2 · 마크다운으로 만든 블로그</p>
  </footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
